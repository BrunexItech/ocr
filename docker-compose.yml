services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - oqtekal_data:/data           # SQLite DB (survives container restarts/updates)
      - oqtekal_storage:/app/storage # uploaded originals
      - easyocr_models:/root/.EasyOCR # OCR model weights (one-time download, cached)
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time - rebuild the image if this changes (see README).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  oqtekal_data:
  oqtekal_storage:
  easyocr_models:
